map $http_x_forwarded_proto $hsts_header {
    https "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen __PORT__;
    server_name _;
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security $hsts_header always;

    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/api/public;
        fastcgi_pass 127.0.0.1:9000;
    }

    location /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/api/public;
        fastcgi_pass 127.0.0.1:9000;
    }

    location /storage/ {
        alias /var/www/api/storage/app/public/;
    }

    location / {
        root /var/www/web;
        try_files $uri $uri/ /index.html;
    }
}
